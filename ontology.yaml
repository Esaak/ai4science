# Онтология проекта: классы, отношения, правила графа.
# Источник истины для графа. По ней агент создаёт заметки классов в ontology/ и пишет
# связи в заметках объектов (AGENTS.md, раздел «Граф проекта»). Формат — practice.md
# недели 4. Проверка: .venv/bin/python checks/check_week4.py
# Агент этот файл не меняет: решение о новых классах принимает человек.

ontology: суррогат-LES-PM25
goal: >
  Записывать ход работы так, чтобы по графу было видно: на каких сценах и каком
  семействе измерена каждая метрика, каким экспериментом получена, чем проверена,
  какие оговорки на ней висят, в каком файле что лежит и на какие источники
  опирается критерий приемлемости модели.

competency_questions:
  - Какие сцены модель предсказывает хуже всего и чем они отличаются от остальных по входным признакам?
  - На каких данных и каким способом измерена каждая метрика — на полной валидации, на пяти худших сценах или на одном семействе?
  - Какие ограничения данных действуют на результат и что из него нельзя переносить на качество модели?
  - В каком файле лежит каждый набор данных, скрипт и результат?
  - На какие источники опирается критерий приемлемости модели?

# Классы — множества объектов. Экземпляры («Сцена 6792», «R²») сюда не пишутся:
# они живут заметками в notes/. Задача и Файл обязательны по требованию курса:
# Файл обслуживает вопрос 4, Задача — ведение работы, а не вопрос к графу.
classes:
  ИнформационныйОбъект:
    parent: null
    definition: объект, который несёт сведения — данные, утверждение, модель, текст
  Процесс:
    parent: null
    definition: то, что происходит во времени — расчёт, проверка
  Файл:
    parent: null
    definition: файл проекта — массив, код, таблица, текст; узел графа — сам файл, отдельной заметки не получает
  Задача:
    parent: ИнформационныйОбъект
    definition: поручение человека или его часть; заметки задач в tasks/ ведёт агент
  Сцена:
    parent: ИнформационныйОбъект
    definition: один трассер одного прогона LES — единица данных проекта
  Семейство:
    parent: ИнформационныйОбъект
    definition: множество сцен одной кампании расчётов; определяется префиксом поля campaign
  НаборДанных:
    parent: ИнформационныйОбъект
    definition: выборка сцен, лежащая в одном файле
  Признак:
    parent: ИнформационныйОбъект
    definition: числовой признак сцены — столбец из cols в val.npz
  Метрика:
    parent: ИнформационныйОбъект
    definition: вид измерения качества предсказания, без значения
  Метод:
    parent: ИнформационныйОбъект
    definition: способ обработки данных или постановки расчёта
  Результат:
    parent: ИнформационныйОбъект
    definition: значение метрики, измеренное на названных данных для названной модели
  Гипотеза:
    parent: ИнформационныйОбъект
    definition: утверждение, которое проверяют расчётом и которое может оказаться ложным
  МодельСуррогат:
    parent: ИнформационныйОбъект
    definition: обученная модель, предсказание которой лежит в данных проекта
  Ограничение:
    parent: ИнформационныйОбъект
    definition: известный дефект данных или условие применимости результата
  Источник:
    parent: ИнформационныйОбъект
    definition: опубликованная работа, на которую ссылаются; текст — в library/
  Автор:
    parent: null
    definition: человек — автор опубликованной работы
  Отчёт:
    parent: ИнформационныйОбъект
    definition: текст об исследовании для читателя; заметка отчёта — сам файл в reports/
  Эксперимент:
    parent: Процесс
    definition: расчёт, который проверяет гипотезу или измеряет метрику
  Проверка:
    parent: Процесс
    definition: независимая проверка результата другим способом
  ЗапросКГрафу:
    parent: Процесс
    definition: >
      обращение к внешнему графу знаний — инструмент и его аргументы, дата обращения,
      число найденных записей и число отобранных в проект

# Отношения: domain — класс источника связи, range — класс цели. Связь пишется в той
# заметке, от которой идёт.
properties:
  подзадачаОт:   {domain: Задача, range: Задача, characteristics: [транзитивное]}
  решает:        {domain: [Эксперимент, Проверка, ЗапросКГрафу], range: Задача}
  выполняет:     {domain: Отчёт, range: Задача}
  проверяет:     {domain: Эксперимент, range: Гипотеза}
  использует:    {domain: Эксперимент, range: [НаборДанных, Сцена, Признак]}
  применяет:     {domain: [Эксперимент, Проверка], range: Метод}
  даёт:          {domain: Эксперимент, range: Результат}
  измеряет:      {domain: Результат, range: Метрика}
  измеренНа:     {domain: Результат, range: [НаборДанных, Семейство, Сцена]}
  дляМодели:     {domain: Результат, range: МодельСуррогат}
  проверенЧерез: {domain: Результат, range: Проверка}
  подтверждает:  {domain: Результат, range: Гипотеза}
  опровергает:   {domain: Результат, range: Гипотеза}
  входитВ:       {domain: [Сцена, Семейство], range: [Семейство, НаборДанных]}
  ограничивает:  {domain: Ограничение, range: [НаборДанных, Результат]}
  основанаНа:    {domain: [Гипотеза, Метрика], range: Источник}
  найденЗапросом: {domain: Источник, range: ЗапросКГрафу}
  написан:       {domain: Источник, range: Автор}
  цитирует:      {domain: Источник, range: Источник}
  ссылаетсяНа:   {domain: Отчёт, range: Источник}
  описывает:     {domain: Отчёт, range: [Эксперимент, Результат]}
  хранитсяВ:     {domain: [НаборДанных, Результат, Источник], range: Файл}
  реализованВ:   {domain: [Эксперимент, Проверка], range: Файл}

attributes:
  status:
    domain: Задача
    values: [открыта, в работе, выполнена, заблокирована, принята]
  oa_status:
    domain: Источник
    values: [diamond, gold, hybrid, green, bronze, closed]

rules:
  - id: П1
    text: У каждого числа есть эксперимент, который его дал.
    dl: "Результат ⊑ ∃даёт⁻.Эксперимент"
    check: {kind: some_inverse, class: Результат, property: даёт, source: Эксперимент}
  - id: П2
    text: Каждая сцена принадлежит ровно одному семейству.
    dl: "Сцена ⊑ = 1 входитВ.Семейство"
    check: {kind: exactly_one, class: Сцена, property: входитВ, target: Семейство}
  - id: П3
    text: >
      Оговорка не висит в воздухе: она всегда говорит, к каким данным или к какому
      результату относится.
    dl: "Ограничение ⊑ ∃ограничивает.(НаборДанных ⊔ Результат)"
    check: {kind: some, class: Ограничение, property: ограничивает, target: [НаборДанных, Результат]}
  - id: П4
    text: Результат считается принятым только тогда, когда его пересчитали другим способом.
    dl: "ПринятыйРезультат ≡ Результат ⊓ ∃проверенЧерез.Проверка"
    check: {kind: defined, name: ПринятыйРезультат, class: Результат, property: проверенЧерез, target: Проверка}
  - id: П5
    text: "Если задача выполнена, в её заметке есть «Итог»: что сделано и чем проверено."
    dl: >
      ВыполненнаяЗадача ≡ Задача ⊓ ∃status.{выполнена, принята}; наличие раздела «Итог» —
      правило оформления, в DL не выражается
    check: {kind: section, class: Задача, attribute: status, values: [выполнена, принята], section: Итог}
  - id: Л1
    text: Каждый источник указывает запрос к внешнему графу, которым он найден или сверен.
    dl: "Источник ⊑ ∃найденЗапросом.ЗапросКГрафу"
    check: {kind: some, class: Источник, property: найденЗапросом, target: ЗапросКГрафу}
  - id: Л2
    text: У каждого источника записан хотя бы один автор.
    dl: "Источник ⊑ ∃написан.Автор"
    check: {kind: some, class: Источник, property: написан, target: Автор}
